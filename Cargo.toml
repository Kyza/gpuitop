[package]
name = "gpuitop"
version = "0.1.0"
edition = "2021"
description = "Linux-first process manager"
license = "MIT"
authors = ["Kyza"]
repository = "https://github.com/Kyza/gpuitop"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
lexopt = "0.3"
procfs = "0.16"
nvml-wrapper = "0.10"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
ron2 = "0.3"
anyhow = "1"
users = "0.11"
libc = "0.2"
num_cpus = "1"
bytesize = "1"
hotpath = "0.22"
nucleo = "0.5"
open = "5"
rust-embed = "8"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[features]
hotpath = ["hotpath/hotpath"]
hotpath-cpu = ["hotpath/hotpath-cpu"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
hotpath-mcp = ["hotpath/hotpath-mcp"]

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
cargo_metadata = "0.19"
