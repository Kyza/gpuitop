[workspace]
resolver = "2"
	members = [
	"crates/gpuitop",
	"crates/packaging",
	"crates/core",
	"crates/gpu",
	"crates/elevation",
	"crates/icons",
	"crates/snapshot",
	"crates/properties",
	"crates/window_picker",
	"crates/components",
	"crates/processes",
	"crates/performance",
	"crates/settings",
]

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
	"wayland",
	"x11",
	"font-kit",
	"runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
lexopt = "0.3"
procfs = "0.16"
nvml-wrapper = "0.10"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
ron2 = "0.3"
anyhow = "1"
users = "0.11"
libc = "0.2"
bytesize = "1"
hotpath = "0.22"
nucleo = "0.5"
open = "5"
rust-embed = "8"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = "0.13"
cargo_metadata = "0.19"
async-channel = "2"
linicon = "2.3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
