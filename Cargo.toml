[workspace]
resolver = "2"
members = [
	"crates/gpuitop",
	"crates/core",
	"crates/gpu",
	"crates/icons",
	"crates/snapshot",
	"crates/properties",
	"crates/window-picker",
	"crates/ui",
]

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
	"wayland",
	"x11",
	"font-kit",
	"runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
lexopt = "0.3"
procfs = "0.16"
nvml-wrapper = "0.10"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
ron2 = "0.3"
anyhow = "1"
users = "0.11"
libc = "0.2"
num_cpus = "1"
bytesize = "1"
hotpath = "0.22"
nucleo = "0.5"
open = "5"
rust-embed = "8"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
oswap = "1"
cargo_metadata = "0.19"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
