[package]
name = "gpuitop_performance"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
gpuitop_core = { path = "../core" }
gpuitop_components = { path = "../components" }
gpui = { workspace = true }
gpui-component = { workspace = true }
bytesize = { workspace = true }
hotpath = { workspace = true }

[features]
default = []
hotpath = ["hotpath/hotpath"]
