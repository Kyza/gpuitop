[package]
name = "gpuitop"
version = "0.1.0"
edition = "2021"
description = "A GPU-accelerated task manager with per-process VRAM tracking"
license = "MIT"
authors = ["Kyza"]
repository = "https://github.com/Kyza/gpuitop"

[dependencies]
gpuitop_core = { path = "../core" }
gpuitop_gpu = { path = "../gpu" }
gpuitop_elevation = { path = "../elevation" }
gpuitop_icons = { path = "../icons" }
gpuitop_snapshot = { path = "../snapshot" }
gpuitop_window_picker = { path = "../window_picker" }
gpuitop_components = { path = "../components" }
gpuitop_processes = { path = "../processes" }
gpuitop_performance = { path = "../performance" }
gpuitop_settings = { path = "../settings" }
gpuitop_properties = { path = "../properties" }
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
gpui-component-assets = { workspace = true }
lexopt = { workspace = true }
async-channel = { workspace = true }
hotpath = { workspace = true }

[build-dependencies]
cargo_metadata = { workspace = true }

[features]
default = []
hotpath = [
	"hotpath/hotpath",
	"gpuitop_core/hotpath",
	"gpuitop_gpu/hotpath",
	"gpuitop_snapshot/hotpath",
	"gpuitop_processes/hotpath",
	"gpuitop_performance/hotpath",
	"gpuitop_settings/hotpath",
	"gpuitop_properties/hotpath",
]
hotpath-cpu = [
	"hotpath/hotpath-cpu",
	"gpuitop_core/hotpath-cpu",
	"gpuitop_gpu/hotpath-cpu",
	"gpuitop_snapshot/hotpath-cpu",
	"gpuitop_processes/hotpath-cpu",
	"gpuitop_performance/hotpath-cpu",
	"gpuitop_settings/hotpath-cpu",
	"gpuitop_properties/hotpath-cpu",
]
hotpath-alloc = [
	"hotpath/hotpath-alloc",
	"gpuitop_core/hotpath-alloc",
	"gpuitop_gpu/hotpath-alloc",
	"gpuitop_snapshot/hotpath-alloc",
	"gpuitop_processes/hotpath-alloc",
	"gpuitop_performance/hotpath-alloc",
	"gpuitop_settings/hotpath-alloc",
	"gpuitop_properties/hotpath-alloc",
]
hotpath-mcp = [
	"hotpath/hotpath-mcp",
	"gpuitop_core/hotpath-mcp",
	"gpuitop_gpu/hotpath-mcp",
	"gpuitop_snapshot/hotpath-mcp",
	"gpuitop_processes/hotpath-mcp",
	"gpuitop_performance/hotpath-mcp",
	"gpuitop_settings/hotpath-mcp",
	"gpuitop_properties/hotpath-mcp",
]
